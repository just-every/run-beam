name: Clone journey
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '19 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # rer's servers keep their real 15 GiB free-space guard; Beam uses none of
      # these preinstalled SDKs, so remove them on GitHub's disposable runner.
      - name: Reclaim unused hosted-runner SDKs
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: pnpm exec rer check --profile first-party
      # The clone journey opens Chromium against its own dev and preview servers.
      - run: pnpm exec playwright install --with-deps chromium
      # The checkout is a fresh clone: the journey runs setup, dev, build,
      # preview, export and import in it through pnpm exec rer.
      - run: pnpm run test:journey
        env:
          BEAM_TEST_CHECKOUT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beam-journey-pages
          path: test-results/*.png
