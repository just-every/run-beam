name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Evidence is only a push run of this workflow from this repository, never this run: a pull request
          # tests its merge ref, a dispatch may run a subset, and a PR run of this workflow may itself be a skip.
          # Prints "<status> <conclusion>" of the newest such run on SHA $1, or nothing (any API error: nothing).
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # C1: main push of a SHA whose newest push run of this workflow (a branch run) is green.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # C3 (exact): same tree as the parent, and the parent's newest push run is green (e.g. an empty commit).
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # C2: same-repository PR. The lander takes any green same-repo run on the exact SHA as evidence,
          # pull_request runs included, so this run may pass without shards only when the push run on the
          # PR head is green: wait for it (at most 25 minutes).
          # No push run, any other result, or the wait running out: run in full.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  dev-personas:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      BEAM_TEST_CHECKOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: node tests/beam/dev-personas.mjs
  rer-verify:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # The complete wall is split across the focused jobs below to fit the 15-minute job limit.
    timeout-minutes: 15
    env:
      CI: 'true'
      # Focused jobs below run authoring APIs, model preparation and tutor checks.
      BEAM_REGRESSION_EXCLUDE: 'OPS-003,OPS-007,AUTO-004,PACK-003-custody,AUTHOR-001,AUTHOR-002,LEARN-008,AUTHOR-007'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Leave room for the complete wall, reclaiming only as much as it needs.
      - name: Reclaim unused hosted-runner SDKs
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          for sdk in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            available=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
            if [ "$available" -ge $((20 * 1024 * 1024)) ]; then break; fi
            sudo rm -rf -- "$sdk"
          done
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      # rer verify ends with the hydration check, which needs Chromium.
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install --only-shell chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - run: pnpm exec rer verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beam-pages
          path: test-results/*.png
  durability:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: pnpm exec rer build && node tests/beam/regressions.mjs --only=OPS-007,AUTO-004
  erasure-custody:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: pnpm exec rer build && node tests/beam/regressions.mjs --only=OPS-003
  package-custody:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: pnpm exec rer build && node tests/beam/regressions.mjs --only=PACK-003-custody,LEARN-008,AUTHOR-007
  tutor-browser:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install --only-shell chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - run: pnpm exec rer build
      - name: Tutor custody and responsive screens
        run: BEAM_TUTOR_BROWSER=1 BEAM_EVIDENCE_DIR="$RUNNER_TEMP/beam-tutor-pages" node tests/beam/regressions.mjs --only=LEARN-008
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beam-tutor-pages
          path: ${{ runner.temp }}/beam-tutor-pages/*.png
  learning-and-source-browser:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install --only-shell chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - run: pnpm exec rer build
      - run: node tests/beam/regressions.mjs --only=AUTHOR-001,AUTHOR-002 --browser
      - run: node tests/beam/model-browser.mjs
      - run: node tests/beam/erasure-browser.mjs
      - run: node tests/beam/mobile-learning-browser.mjs
      - run: node tests/beam/regressions.mjs --only=OPS-008 --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beam-learning-and-source-pages
          path: test-results/*.png
  source:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm exec rer check --profile first-party

  verify:
    needs: [plan, dev-personas, rer-verify, durability, erasure-custody, package-custody, tutor-browser, learning-and-source-browser, source]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
