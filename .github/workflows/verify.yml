name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dev-personas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      BEAM_TEST_CHECKOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reclaim unused hosted-runner SDKs
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: node tests/beam/dev-personas.mjs
  verify:
    runs-on: ubuntu-24.04
    # The complete wall is split across the focused jobs below to fit the 15-minute job limit.
    timeout-minutes: 15
    env:
      CI: 'true'
      # Focused jobs below run authoring APIs, model preparation and tutor checks.
      BEAM_REGRESSION_EXCLUDE: 'OPS-003,OPS-007,AUTO-004,PACK-003-custody,AUTHOR-001,AUTHOR-002,LEARN-008,AUTHOR-007'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # rer's servers keep their real 15 GiB free-space guard; Beam uses none of
      # these preinstalled SDKs, so remove them on GitHub's disposable runner.
      - name: Reclaim unused hosted-runner SDKs
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      # rer verify ends with the hydration check, which needs Chromium.
      # The Azure HTTP mirror throttled font packages to 50 kB/s and consumed
      # nine minutes of the 15-minute wall. Keep the same signed Ubuntu packages.
      - name: Use the official Ubuntu HTTPS archive for browser dependencies
        run: |
          # Current runner images use mirror+file: indirection in ubuntu.sources.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm exec rer verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beam-pages
          path: test-results/*.png
  durability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reclaim unused hosted-runner SDKs
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: pnpm exec rer build && node tests/beam/regressions.mjs --only=OPS-007,AUTO-004
  erasure-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reclaim unused hosted-runner SDKs
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: pnpm exec rer build && node tests/beam/regressions.mjs --only=OPS-003
  package-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reclaim unused hosted-runner SDKs
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: pnpm exec rer build && node tests/beam/regressions.mjs --only=PACK-003-custody,LEARN-008,AUTHOR-007
  learning-and-source-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reclaim unused hosted-runner SDKs
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      # The Azure HTTP mirror throttled font packages to 50 kB/s and consumed
      # nine minutes of the 15-minute wall. Keep the same signed Ubuntu packages.
      - name: Use the official Ubuntu HTTPS archive for browser dependencies
        run: |
          # Current runner images use mirror+file: indirection in ubuntu.sources.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm exec rer build
      - run: node tests/beam/regressions.mjs --only=AUTHOR-001,AUTHOR-002 --browser
      - run: node tests/beam/model-browser.mjs
      - run: node tests/beam/erasure-browser.mjs
      - run: node tests/beam/mobile-learning-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beam-learning-and-source-pages
          path: test-results/*.png
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm exec rer check --profile first-party
